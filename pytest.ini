[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers --tb=short
asyncio_mode = auto

# Tests that need a real GPU are marked and skipped by default. CI has no GPU, and
# a test that silently passes on the CPU provider would create false confidence in
# exactly the area where confidence must be earned on real hardware
# (plan Phases 6, 7, 7b).
markers =
    gpu: requires a real NVIDIA GPU with a working CUDAExecutionProvider
    integration: needs a running container or network access
