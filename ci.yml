name: CI

# Plan reference: Â§33.
#
# WHAT CI CAN AND CANNOT PROVE.
#
# GitHub-hosted runners have no NVIDIA GPU. So CI proves the image builds, the
# CPU-side logic is correct, the API contract is enforced, and the preprocessing
# and quality functions still match the committed reference fixtures.
#
# It CANNOT prove: the CUDA provider is actually used, real inference numerics,
# Â§24 parity, or Â§25 throughput. Those are manual gates on a real RTX 4090 Pod
# (plan Phases 6, 7, 7b) and must be re-run for every image version. Pretending
# otherwise would be the most dangerous thing this pipeline could do.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  # NOT used directly in an image reference — see the "Resolve image name" step.
  # github.repository preserves the owner's letter case (e.g. Ricky1493/runpod),
  # but Docker requires image names to be entirely lowercase, so interpolating it
  # straight into a tag fails the push with "repository name must be lowercase".
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.6.9 black==24.10.0 mypy==1.11.2
      - run: ruff check app tests scripts
      - run: black --check app tests scripts
      # Not strict: the InsightFace and cv2 stubs are incomplete, and a wall of
      # third-party ignores would train people to ignore the output.
      - run: mypy app --ignore-missing-imports --no-strict-optional

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install (CPU onnxruntime â€” no GPU on hosted runners)
        run: |
          pip install \
            onnxruntime==1.19.2 \
            insightface==0.7.3 \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            httpx==0.27.2 \
            uvicorn==0.30.6
          pip install pytest==8.3.3 pytest-asyncio==0.24.0 respx==0.21.1
      - name: Run tests
        run: pytest tests -v --tb=short

      # THE DRIFT GUARD. tests/fixtures/ holds arrays and values produced by
      # India's real core/ code. If preprocess.py or quality.py ever diverges from
      # it, embeddings silently stop matching the production FAISS index â€” so this
      # failing must block the build.
      - name: Verify parity fixtures
        run: pytest tests/test_preprocess.py tests/test_quality.py -v

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.7.3
      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt --strict
        continue-on-error: true
      - name: Confirm no database drivers are declared
        # Invariant 1 from plan Â§3: the worker physically cannot reach production
        # data stores. Absence is a stronger guarantee than policy, so it is
        # asserted here rather than trusted.
        run: |
          if grep -Eiq '^(pyodbc|psycopg2|psycopg|faiss|pymssql|sqlalchemy)' requirements.txt; then
            echo "::error::A database driver is declared in requirements.txt. The"
            echo "::error::GPU worker must never be able to reach MSSQL, PostgreSQL"
            echo "::error::or FAISS (plan Â§3 invariants 1 and 2)."
            exit 1
          fi
          echo "No database drivers declared."

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        # Lowercase the owner/repo. Required because Docker rejects uppercase in
        # image references, and GitHub account names commonly contain capitals.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Refuse to build ':latest' as a production reference
        run: |
          if [ "${{ steps.version.outputs.version }}" = "latest" ]; then
            echo "::error::VERSION must be a semantic version, never 'latest' (plan Â§9.4)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tag)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            MODEL_NAME=buffalo_l
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Scan image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Record the digest
        # The digest is what India deploys. A tag is policy; a digest is a
        # guarantee that the model which produced an embedding is identifiable.
        run: |
          echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest:  ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set GPU_IMAGE_DIGEST on the India server to this digest AFTER" >> "$GITHUB_STEP_SUMMARY"
          echo "Phase 6 verification and Phase 7b parity acceptance pass." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [build]
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: face-gpu-worker:ci
          build-args: |
            IMAGE_VERSION=ci
            MODEL_NAME=buffalo_l
          cache-from: type=gha

      - name: Start with the CPU provider
        # There is no GPU here, so the container is started with
        # CPUExecutionProvider purely to exercise the HTTP surface. This proves
        # nothing about production numerics.
        run: |
          docker run -d --name worker \
            -e GPU_WORKER_API_KEY=ci-test-key-0123456789abcdef \
            -e MODEL_NAME=buffalo_l \
            -e ONNX_PROVIDER=CPUExecutionProvider \
            -e CTX_ID=-1 \
            -e ALLOWED_URL_HOSTS=s3.us-west-004.backblazeb2.com \
            -p 8000:8000 \
            face-gpu-worker:ci
          for i in $(seq 1 60); do
            if curl -fsS -H "Authorization: Bearer ci-test-key-0123456789abcdef" \
                 http://127.0.0.1:8000/v1/health >/dev/null 2>&1; then
              echo "worker is ready after ${i}0s"; break
            fi
            sleep 10
          done

      - name: Assert the security and contract surface
        run: |
          set -e
          KEY=ci-test-key-0123456789abcdef

          echo "--- /v1/health must reject an unauthenticated request ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/health)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }

          echo "--- /v1/process must reject an unauthenticated request ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8000/v1/process -d '{}')
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }

          echo "--- /v1/health must report the model and provider ---"
          curl -fsS -H "Authorization: Bearer $KEY" \
            http://127.0.0.1:8000/v1/health | tee /tmp/health.json
          python3 - <<'PY'
          import json, sys
          h = json.load(open("/tmp/health.json"))
          assert h["embedding_dim"] == 512, h["embedding_dim"]
          assert h["det_size"] == [640, 640], h["det_size"]
          assert h["det_thresh"] == 0.6, h["det_thresh"]
          assert h["max_detection_size"] == 640, h["max_detection_size"]
          assert h["normalized"] is True
          assert h["model_pack_sha256"], "no model hashes reported â€” models were not baked in"
          print("health assertions passed:", h["status"], h["provider"])
          PY

          echo "--- a malformed body must be rejected with 422 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            http://127.0.0.1:8000/v1/process -d '{"batch_id":"not-a-uuid","images":[]}')
          [ "$code" = "422" ] || { echo "expected 422, got $code"; exit 1; }

          echo "--- a non-allowlisted URL host must be rejected per image ---"
          curl -fsS -X POST -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            http://127.0.0.1:8000/v1/process \
            -d '{"batch_id":"11111111-1111-4111-8111-111111111111",
                 "images":[{"picture_id":1,"image_url":"https://evil.example.com/x.jpg"}]}' \
            | tee /tmp/ssrf.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/ssrf.json"))["results"][0]
          assert r["success"] is False, r
          assert r["error_code"] == "url_rejected", r
          print("SSRF allowlist assertion passed")
          PY

      - name: Container logs
        if: always()
        run: docker logs worker || true

      - name: Clean up
        if: always()
        run: docker rm -f worker || true
